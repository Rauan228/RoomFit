name: RoomFit checks
on: [push, pull_request]
jobs:
  platform-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install platform and core dependencies only
        run: npm ci --include=dev --workspace=@roomfit/platform --workspace=@roomfit/core --include-workspace-root=false
      - name: Build platform without root test dependencies
        working-directory: platform
        run: npm run build
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run setup:api
      - run: npm run build
      - run: npm test
      - run: npm run test:api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:landing
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            test-results/
            landing/test-results/
