# Managed by RoomFit. HTTP bootstrapping before certificate issuance.
server {
    listen 80;
    server_name roomfit.art www.roomfit.art;
    root /opt/roomfit/web-current/landing/dist;
    index index.html;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/roomfit/acme; }
    location /assets/ { try_files $uri =404; }
    error_page 404 /404.html;
    location = /404.html { internal; add_header X-Robots-Tag "noindex, follow" always; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
server {
    listen 80;
    server_name platform.roomfit.art;
    root /opt/roomfit/web-current/platform/dist;
    index index.html;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/roomfit/acme; }
    # Mutations require the Secure session cookies issued over HTTPS.
    location /api/ {
        proxy_pass http://127.0.0.1:4182;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
