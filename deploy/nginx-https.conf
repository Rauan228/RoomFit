server {
    listen 443 ssl;
    server_name roomfit.212.19.134.179.sslip.io;
    ssl_certificate /etc/letsencrypt/live/roomfit.212.19.134.179.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roomfit.212.19.134.179.sslip.io/privkey.pem;
    client_max_body_size 8m;
    root /opt/roomfit/platform/dist;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    access_log /var/log/nginx/roomfit-access.log;
    error_log /var/log/nginx/roomfit-error.log;
    location /api/ {
        proxy_pass http://127.0.0.1:4182;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_hide_header Server;
    }
    location /assets/ { try_files $uri =404; expires 7d; }
    location / { try_files $uri /index.html; }
    location ~ /\. { deny all; }
}
