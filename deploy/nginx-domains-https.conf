# Managed by RoomFit. Landing, platform and same-origin API on the VPS.
log_format roomfit_events escape=json '{"at":"$time_iso8601","host":"$host","event":"$arg_event","page":"$arg_page","source":"$arg_source"}';
map $arg_event $roomfit_valid_event { default 0; ~^(page_view|platform_click|signup_complete|project_created|project_saved)$ 1; }
map $arg_page $roomfit_valid_page { default 0; ~^(home|guides|arrangement|bedroom12|small9|sofa|measure|about|privacy|terms|platform|other)$ 1; }
map $arg_source $roomfit_valid_source { default 0; ~^(direct|google|bing|yandex|chatgpt|perplexity|other)$ 1; }
map "$roomfit_valid_event:$roomfit_valid_page:$roomfit_valid_source" $roomfit_valid_request { default 0; "1:1:1" 1; }
server {
    listen 80;
    server_name roomfit.art www.roomfit.art platform.roomfit.art;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/roomfit/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.roomfit.art;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/roomfit.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roomfit.art/privkey.pem;
    return 301 https://roomfit.art$request_uri;
}
server {
    listen 443 ssl;
    server_name roomfit.art;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/roomfit.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roomfit.art/privkey.pem;
    root /opt/roomfit/web-current/landing/dist;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    access_log /var/log/nginx/roomfit-landing-access.log;
    error_log /var/log/nginx/roomfit-landing-error.log;
    location = /events {
        if ($request_method != GET) { return 405; }
        if ($roomfit_valid_request = 0) { return 400; }
        access_log /var/log/nginx/roomfit-events.log roomfit_events;
        add_header Cache-Control "no-store" always;
        return 204;
    }
    location /assets/ { try_files $uri =404; expires 30d; }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
    error_page 404 /404.html;
    location = /404.html { internal; add_header X-Robots-Tag "noindex, follow" always; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
    location ~ /\. { deny all; }
}
server {
    listen 443 ssl;
    server_name platform.roomfit.art;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/roomfit.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roomfit.art/privkey.pem;
    client_max_body_size 8m;
    root /opt/roomfit/web-current/platform/dist;
    index index.html;
    add_header X-Robots-Tag "noindex, follow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    access_log /var/log/nginx/roomfit-platform-access.log;
    error_log /var/log/nginx/roomfit-platform-error.log;
    location = /events {
        if ($request_method != GET) { return 405; }
        if ($roomfit_valid_request = 0) { return 400; }
        access_log /var/log/nginx/roomfit-events.log roomfit_events;
        add_header Cache-Control "no-store" always;
        return 204;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:4182;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_hide_header Server;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }
    location /assets/ { try_files $uri =404; expires 30d; }
    location = /index.html {
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
